version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # Best-effort cleanup and terminal output.
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - (io.Closer).Close
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: false
        - name: var-naming
          disabled: false
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/j-a-man/visual-branches
