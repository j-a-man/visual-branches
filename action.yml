name: visual-branches
description: Post a branch map (stack, PR status, conflicts, and overlapping branches) on pull requests.
author: j-a-man
branding:
  icon: git-branch
  color: purple

inputs:
  version:
    description: vb version to install (a release tag such as v0.1.0, or latest).
    default: latest
  scope:
    description: "stack: only the pull request's lineage and descendants. all: every branch."
    default: stack
  comment:
    description: Post or update a sticky comment on the pull request.
    default: "true"
  summary:
    description: Write the map to the job summary.
    default: "true"
  fail-on-conflict:
    description: Fail the job when the pull request's branch is predicted to conflict with its parent.
    default: "false"
  github-token:
    description: Token used to read pull requests and write the comment.
    default: ${{ github.token }}

outputs:
  state:
    description: The vb state token of the map.
    value: ${{ steps.map.outputs.state }}
  attention:
    description: Number of high-severity items that need attention.
    value: ${{ steps.map.outputs.attention }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    - name: Install vb
      shell: bash
      run: go install "github.com/j-a-man/visual-branches/cmd/vb@${{ inputs.version }}"

    - name: Build the branch map
      id: map
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_REF: ${{ github.head_ref }}
        SCOPE: ${{ inputs.scope }}
        FAIL_ON_CONFLICT: ${{ inputs.fail-on-conflict }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        # vb needs every branch; actions/checkout fetches one by default.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --prune --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
        else
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
        fi
        args=(--source remote --no-color)
        if [ "$SCOPE" = "stack" ] && [ -n "$HEAD_REF" ]; then
          args+=(--focus "$HEAD_REF")
        fi
        vb "${args[@]}" --json > "$RUNNER_TEMP/vb-map.json"
        state=$(jq -r .state "$RUNNER_TEMP/vb-map.json")
        high=$(jq '[.attention[]? | select(.severity == "high")] | length' "$RUNNER_TEMP/vb-map.json")
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "attention=$high" >> "$GITHUB_OUTPUT"

        export_args=(--source remote)
        if [ "$SCOPE" = "stack" ] && [ -n "$HEAD_REF" ]; then
          export_args+=(--focus "$HEAD_REF")
        fi
        {
          echo "<!-- vb-branch-map -->"
          echo "### Branch map"
          echo
          vb export mermaid --markdown "${export_args[@]}"
          echo
          echo "<details><summary>Details for agents and reviewers</summary>"
          echo
          echo '```'
          vb "${args[@]}" --agent --max-tokens 1500
          echo '```'
          echo
          echo "</details>"
          echo
          echo "<sub>Generated by [visual-branches](https://github.com/j-a-man/visual-branches).</sub>"
        } > "$RUNNER_TEMP/vb-comment.md"

        if [ "$SUMMARY" = "true" ]; then
          cat "$RUNNER_TEMP/vb-comment.md" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$FAIL_ON_CONFLICT" = "true" ] && [ -n "$HEAD_REF" ]; then
          if jq -e --arg b "$HEAD_REF" '.branches[] | select(.name == $b) | .forecast.clean == false' "$RUNNER_TEMP/vb-map.json" > /dev/null; then
            echo "::error::$HEAD_REF is predicted to conflict with its parent"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        body=$(cat "$RUNNER_TEMP/vb-comment.md")
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- vb-branch-map -->")) | .id' | head -n 1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null || echo "::warning::could not update the branch map comment (fork pull requests have a read-only token)"
        else
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null || echo "::warning::could not post the branch map comment (fork pull requests have a read-only token)"
        fi

    - name: Fail on predicted conflict
      if: steps.map.outputs.conflict == 'true'
      shell: bash
      run: exit 1
